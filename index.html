<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradinglock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module">
    // --- FIREBASE BOOTSTRAP ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
    apiKey: "AIzaSyAdGlJEWkygcJtU0o4bl_s2wkDyzbUGEQA",
    authDomain: "tradinglock-e8a93.firebaseapp.com",
    projectId: "tradinglock-e8a93",
    storageBucket: "tradinglock-e8a93.firebasestorage.app",
    messagingSenderId: "234232295731",
    appId: "1:234232295731:web:94f9f601c93b806b0bce46"
  };
        
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Make tools globally available for our buttons
    window.auth = auth; window.db = db; window.doc = doc; window.setDoc = setDoc; window.getDoc = getDoc;
    window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
    window.signInWithEmailAndPassword = signInWithEmailAndPassword;
    window.updateProfile = updateProfile;

    // --- APP STATE ---
    let activeUser = null;
    let tradeLogs = [];
    let confluences = [];
    let currentCalendarDate = new Date();

    // --- AUTH FUNCTIONS ---
    window.handleSignup = async function(e) {
        e.preventDefault();
        const username = document.getElementById('reg-username').value.trim();
        const email = document.getElementById('reg-email').value.trim().toLowerCase();
        const password = document.getElementById('reg-password').value;
        try {
            const userCred = await createUserWithEmailAndPassword(auth, email, password);
            await updateProfile(userCred.user, { displayName: username });
            
            // Force save username to Firestore immediately
            await setDoc(doc(db, "users", email), { 
                username: username, 
                tradeLogs: [], 
                confluences: [] 
            });

            activeUser = { email, username };
            localStorage.setItem('tl_active_session', email);
            location.reload();
        } catch (err) { alert(err.message); }
    };

    window.handleLogin = async function(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim().toLowerCase();
        const password = document.getElementById('login-password').value;
        try {
            await signInWithEmailAndPassword(auth, email, password);
            localStorage.setItem('tl_active_session', email);
            location.reload(); 
        } catch (err) { alert(err.message); }
    };

    // --- DATA LOADING ---
    async function loadUserData() {
        if(!activeUser) return;
        try {
            const userRef = doc(db, "users", activeUser.email);
            const docSnap = await getDoc(userRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                tradeLogs = data.tradeLogs || [];
                confluences = data.confluences || [];
                // FIXED: Prioritize the username from the database
                if(data.username) activeUser.username = data.username;
            }
            document.getElementById('user-display').innerText = `@${activeUser.username}`;
            renderChecklists();
            calculateStats();
        } catch (error) { console.error("Load error:", error); }
    }

    async function saveToCloud() {
        if(!activeUser) return;
        await setDoc(doc(db, "users", activeUser.email), {
            username: activeUser.username,
            tradeLogs: tradeLogs,
            confluences: confluences
        }, { merge: true });
    }

    // --- CORE LOGIC ---
    window.saveTradeEntry = async function(e) {
        e.preventDefault();
        const trade = {
            date: document.getElementById('trade-date').value,
            pnl: parseFloat(document.getElementById('trade-pnl').value),
            outcome: document.getElementById('trade-outcome').value,
            grade: document.getElementById('grade-badge').innerText,
            asset: document.getElementById('trade-asset').value.toUpperCase(),
            id: Date.now()
        };
        tradeLogs.push(trade);
        await saveToCloud();
        calculateStats();
        document.getElementById('trade-form').reset();
        window.switchTab('home');
    };

    window.deleteTrade = async function(id) {
        if(confirm("Delete this execution?")) {
            tradeLogs = tradeLogs.filter(t => t.id !== id);
            await saveToCloud();
            calculateStats();
        }
    };

    function calculateStats() {
        const total = tradeLogs.length;
        const wins = tradeLogs.filter(t => t.outcome === 'WIN').length;
        const net = tradeLogs.reduce((sum, t) => sum + t.pnl, 0);
        document.getElementById('stat-winrate').innerText = total ? Math.round((wins/total)*100) + '%' : '0%';
        document.getElementById('stat-pnl').innerText = `$${net.toFixed(2)}`;
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('history-container');
        container.innerHTML = [...tradeLogs].reverse().map(t => `
            <div class="bg-white p-4 rounded-xl border flex justify-between items-center shadow-sm mb-2">
                <div>
                    <span class="font-black text-slate-900">${t.asset}</span> 
                    <span class="text-[10px] text-slate-400 ml-2 font-bold">${t.date}</span>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-[10px] font-black px-2 py-1 rounded bg-slate-100">${t.grade}</span>
                    <span class="font-bold ${t.pnl >= 0 ? 'text-emerald-600' : 'text-red-600'}">${t.pnl >= 0 ? '+' : ''}$${t.pnl}</span>
                    <button onclick="deleteTrade(${t.id})" class="text-slate-300 hover:text-red-500 font-bold ml-2">×</button>
                </div>
            </div>
        `).join('');
    }

    window.renderCalendar = function() {
        const grid = document.getElementById('calendar-grid-content');
        const label = document.getElementById('calendar-month-label');
        grid.innerHTML = '';
        const year = currentCalendarDate.getFullYear();
        const month = currentCalendarDate.getMonth();
        label.innerText = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(currentCalendarDate);
        
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for(let i=0; i<firstDay; i++) grid.innerHTML += '<div></div>';
        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const dayTrades = tradeLogs.filter(t => t.date === dateStr);
            const dayPnL = dayTrades.reduce((s, t) => s + t.pnl, 0);
            let color = 'bg-white';
            if(dayTrades.length > 0) color = dayPnL >= 0 ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200';
            
            grid.innerHTML += `
                <div class="h-20 border rounded-lg p-1 ${color} flex flex-col justify-between">
                    <span class="text-[10px] font-bold text-slate-400">${d}</span>
                    ${dayTrades.length ? `
                        <div class="text-center">
                            <div class="text-[9px] font-black text-slate-500">${dayTrades.length} Tr.</div>
                            <div class="text-[10px] font-black ${dayPnL >= 0 ? 'text-emerald-600' : 'text-red-600'}">${dayPnL >= 0 ? '+' : ''}${Math.round(dayPnL)}</div>
                        </div>
                    ` : ''}
                </div>
            `;
        }
    };

    // --- NAVIGATION ---
    window.showScreen = function(id) {
        ['landing-screen', 'auth-signup', 'auth-login', 'main-app'].forEach(s => {
            const el = document.getElementById(s);
            if(el) el.classList.add('hidden');
        });
        document.getElementById(id).classList.remove('hidden');
    };

    window.switchTab = function(id) {
        ['info', 'home', 'journal', 'calendar', 'rules'].forEach(t => {
            document.getElementById(`view-${t}`).classList.add('hidden');
            document.getElementById(`tab-${t}`).className = 'tab-inactive pb-3 text-sm cursor-pointer';
        });
        document.getElementById(`view-${id}`).classList.remove('hidden');
        document.getElementById(`tab-${id}`).className = 'tab-active pb-3 text-sm cursor-pointer';
        if (id === 'calendar') window.renderCalendar();
    };

    window.logout = function() {
        localStorage.removeItem('tl_active_session');
        signOut(auth).then(() => location.reload());
    };

    // --- BOOTSTRAP ---
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            activeUser = { email: user.email, username: user.displayName || user.email.split('@')[0] };
            await loadUserData();
            window.showScreen('main-app');
        } else {
            window.showScreen('landing-screen');
        }
    });

    window.changeMonth = (dir) => {
        currentCalendarDate.setMonth(currentCalendarDate.getMonth() + dir);
        window.renderCalendar();
    };

    window.addConfluence = () => {
        const input = document.getElementById('new-conf');
        if(input.value.trim()) {
            confluences.push(input.value.trim());
            input.value = '';
            saveToCloud();
            renderChecklists();
        }
    };

    function renderChecklists() {
        const config = document.getElementById('config-checklist');
        const active = document.getElementById('active-checklist');
        if(!config || !active) return;
        config.innerHTML = ''; active.innerHTML = '';
        confluences.forEach((c, idx) => {
            config.innerHTML += `<div class="flex justify-between text-xs bg-slate-50 p-2 rounded mb-1"><span>${c}</span><button onclick="confluences.splice(${idx},1);saveToCloud();renderChecklists();" class="text-red-500">×</button></div>`;
            active.innerHTML += `<label class="flex items-center gap-2 p-1"><input type="checkbox" onchange="updateGrade()" class="conf-check"> ${c}</label>`;
        });
    }

    window.updateGrade = function() {
        const checks = document.querySelectorAll('.conf-check');
        const checked = Array.from(checks).filter(c => c.checked).length;
        const ratio = checks.length ? checked / checks.length : 0;
        let g = 'F';
        if(ratio === 1) g = 'A++'; else if(ratio >= 0.8) g = 'A'; else if(ratio >= 0.6) g = 'B'; else if(ratio >= 0.4) g = 'C';
        document.getElementById('grade-badge').innerText = g;
    };
</script>
</body>
</html>
